# Include-only versioned full-circle camera and owner-audible A/B tone UI.
packages:
  hardware: !include sensors.yaml
external_components:
  - source:
      type: local
      path: components
    components: [triviapod_media]
esphome:
  includes: [camera_cover.h, doorbell_frame.h]
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(ui_final_mode) = true;
          id(board).set_before_motor_pulse([]() {
            id(doorbell_frame).release();
            id(camera_fetching) = false;
          });
          trivia_metrics::before_local_audio = []() {
            id(doorbell_frame).release();
            id(camera_fetching) = false;
          };
      - component.update: panel
http_request:
  id: snapshot_http
  timeout: 2s
  follow_redirects: false
globals:
  - id: camera_page
    type: bool
    initial_value: 'false'
  - id: camera_fetching
    type: bool
    initial_value: 'false'
  - id: camera_requested_at
    type: uint32_t
    initial_value: '0'
  - id: camera_error
    type: bool
    initial_value: 'false'
  - id: ring_baseline_seen
    type: bool
    initial_value: 'false'
  - id: ring_previous
    type: bool
    initial_value: 'false'
image:
  - platform: online_image
    id: doorbell_frame
    http_request_id: snapshot_http
    url: http://example.invalid/snapshot.jpg
    format: JPEG
    type: RGB565
    resize: 352x264
    buffer_size: 32768
    update_interval: never
    on_download_finished:
      then:
        - lambda: |-
            id(camera_fetching) = false;
            if (!cached) {
              const bool accepted = trivia_camera::last.accept(*id(doorbell_frame));
              id(camera_error) = !accepted;
              ESP_LOGI("camera_check", "event=download_complete copied=%s duration_ms=%u received=%u", accepted ? "yes" : "no", unsigned(millis() - id(camera_requested_at)), unsigned(trivia_camera::last.received));
            }
        - component.update: panel
    on_error:
      then:
        - lambda: |-
            id(camera_fetching) = false;
            id(camera_error) = true;
            ESP_LOGW("camera_check", "event=download_error last_good_retained=%s", trivia_camera::last.received ? "yes" : "no");
        - component.update: panel
media_player:
  - platform: speaker
    id: media_backend
    internal: true
    buffer_size: 65536
    volume_initial: 100%  # Maps through max75% to ES8311 0dB, matching local diagnostics.
    volume_max: 75%
    announcement_pipeline:
      speaker: board_speaker
      format: WAV
      sample_rate: 16000
      num_channels: 1
  - platform: triviapod_media
    id: ha_speaker
    name: TriviaPOD Speaker
    backend: media_backend
    speaker_id: board_speaker
    local_busy: !lambda return id(mic_check).is_running() || id(speaker_check).is_running() || !id(board_mic).is_stopped();
    amplifier: !lambda return id(board).amplifier(x);
    on_busy:
      then:
        - lambda: |-
            id(ui_media_busy) = x;
            if (x) {
              id(doorbell_frame).release();
              id(camera_fetching) = false;
              id(ui_action) = "HA sound playing";
            } else {
              id(ui_action) = "HA sound finished";
            }
script:
  - id: camera_refresh
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              return id(camera_page) && (id(camera_snapshot_url).state.rfind("http://",0)==0 || id(camera_snapshot_url).state.rfind("https://",0)==0) && wifi::global_wifi_component->is_connected() && id(board).quiet_for_network() && !id(camera_fetching) && (id(camera_requested_at) == 0 || millis() - id(camera_requested_at) >= (id(camera_error) ? 2000U : 500U)) && !id(ui_media_busy) && !id(mic_check).is_running() && !id(speaker_check).is_running() && id(board_mic).is_stopped() && id(board_speaker).is_stopped();
          then:
            - lambda: |-
                id(camera_fetching) = true;
                id(camera_requested_at) = millis();
            - component.update: doorbell_frame
  - id: doorbell_ring
    mode: single
    then:
      - lambda: |-
          id(camera_page) = true;
          id(ui_action) = "Doorbell ring";
          ESP_LOGI("ring_check", "event=ring uptime_ms=%u", unsigned(millis()));
      - output.set_level:
          id: motor_output
          level: 50%
      - wait_until:
          condition:
            lambda: return id(board).quiet_for_network();
          timeout: 2s
      - component.update: panel
      - script.execute: camera_refresh
binary_sensor:
  - id: !extend blue_button
    on_click:
      - min_length: 30ms
        max_length: 500ms
        then:
          - lambda: |-
              id(camera_page) = !id(camera_page);
              ESP_LOGI("key_check", "event=blue_short_click page=%s", id(camera_page) ? "doorbell" : "checks");
          - component.update: panel
          - script.execute: camera_refresh
      - min_length: 600ms
        max_length: 3s
        then:
          - lambda: |-
              id(camera_page) = false;
              ESP_LOGI("key_check", "event=blue_hold_tone");
          - script.execute: speaker_check
  - id: !extend power_button
    on_press:
      - lambda: id(camera_page) = false;
      - component.update: panel
touchscreen:
  - id: !extend board_touch
    on_touch:
      - lambda: |-
          const int x = touch.x, y = touch.y;
          if (id(camera_page)) {
            if (y >= 380 && y <= 425) {
              if (x >= 100 && x <= 230) id(camera_page) = false;
              else if (x >= 240 && x <= 370) id(camera_refresh).execute();
            }
          } else if (y >= 265 && y <= 310) {
            if (x >= 100 && x <= 230) id(mic_check).execute();
            else if (x >= 240 && x <= 370) {
              trivia_tone::requested_profile = trivia_tone::Profile::HIGH_B;
              ESP_LOGI("tone_check", "event=touch_request profile=B x=%d y=%d uptime_ms=%u", x, y, unsigned(millis()));
              id(speaker_check).execute();
            }
          } else if (y >= 320 && y <= 365) {
            if (x >= 100 && x <= 230) id(board).motor_pulse(0.5f);
            else if (x >= 240 && x <= 370) id(power_led).toggle();
          } else if (y >= 380 && y <= 425) {
            if (x >= 110 && x < 185) {
              auto call = id(display_brightness).make_call();
              call.set_value(std::max(10.0f, id(display_brightness).state - 20.0f)); call.perform();
            } else if (x >= 190 && x <= 275) {
              id(camera_page) = true; id(camera_refresh).execute();
            } else if (x > 280 && x <= 355) {
              auto call = id(display_brightness).make_call();
              call.set_value(std::min(100.0f, id(display_brightness).state + 20.0f)); call.perform();
            }
          }
      - component.update: panel
display:
  - id: !extend panel
    update_interval: 1s
    lambda: |-
      it.fill(Color::BLACK);
      const auto text = [&](int y, const char *value) {
        it.print(234, y + 1, id(ui_font), Color::BLACK, TextAlign::CENTER, value);
        it.print(233, y, id(ui_font), Color::WHITE, TextAlign::CENTER, value);
      };
      const auto control = [&](int left, int top, int width, const char *label) {
        it.rectangle(left, top, width, 40, Color(80, 140, 180));
        it.print(left + width/2 + 1, top + 21, id(ui_font), Color::BLACK, TextAlign::CENTER, label);
        it.print(left + width/2, top + 20, id(ui_font), Color::WHITE, TextAlign::CENTER, label);
      };
      if (id(camera_page)) {
        if (id(camera_snapshot_url).state.empty()) {
          text(230, "Set Snapshot URL in HA");
        } else if (trivia_camera::last.received) {
          trivia_camera::last.draw_cover(it);
          trivia_camera::last.mark_presented();
          char status[64];
          snprintf(status, sizeof(status), "Age %us%s", unsigned((millis() - trivia_camera::last.received_at)/1000), id(camera_error) ? " / fetch error" : "");
          text(350, status);
        } else text(230, id(camera_error) ? "Snapshot unavailable" : "Waiting for snapshot");
        text(50, "Doorbell");
        if (!wifi::global_wifi_component->is_connected()) text(78, "Wi-Fi disconnected");
        control(100, 380, 130, "Checks"); control(240, 380, 130, "Refresh");
      } else {
        it.circle(233, 233, 220, Color(100, 100, 100));
        text(50, "TriviaPOD prototype");
        it.printf(233, 90, id(ui_font), Color::WHITE, TextAlign::CENTER, "Yellow %d   Blue %d   Power %d", id(yellow_count), id(blue_count), id(power_count));
        it.printf(233, 115, id(ui_font), Color::WHITE, TextAlign::CENTER, "Touch %d,%d %s", id(touch_x), id(touch_y), id(screen_touch).state ? "down" : "up");
        it.printf(233, 140, id(ui_font), Color::WHITE, TextAlign::CENTER, "BAT %.3fV  USB %.3fV", id(battery_voltage).state, id(usb_voltage).state);
        it.printf(233, 165, id(ui_font), Color::WHITE, TextAlign::CENTER, "Charge %s / brightness %.0f%%", id(battery_charging).state ? "on" : "off", id(display_brightness).state);
        text(195, id(ui_action).c_str());
        it.printf(233, 220, id(ui_font), Color::WHITE, TextAlign::CENTER, "Mic peak %d", trivia_metrics::microphone_peak.load());
        text(242, wifi::global_wifi_component->is_connected() ? "Wi-Fi connected / add in HA" : "Set Wi-Fi via USB installer");
        control(100, 265, 130, "Mic replay"); control(240, 265, 130, "Tone 1/2k");
        control(100, 320, 130, "Motor"); control(240, 320, 130, "LED");
        control(110, 380, 70, "Dim"); control(190, 380, 85, "Camera"); control(285, 380, 70, "Bright");
        it.print(233, 430, id(version_font), Color::WHITE, TextAlign::CENTER, trivia_version::DISPLAY_VERSION);
        it.print(233, 445, id(version_font), Color::WHITE, TextAlign::CENTER, trivia_version::BUILD_SHORT);
        if (id(screen_touch).state) it.circle(id(touch_x), id(touch_y), 8, Color(255, 230, 0));
      }
      if (id(version_splash)) {
        it.filled_rectangle(65, 170, 336, 115, Color::BLACK);
        it.rectangle(65, 170, 336, 115, Color(80, 140, 180));
        it.print(233, 190, id(ui_font), Color::WHITE, TextAlign::CENTER, "TriviaPOD firmware");
        it.print(233, 220, id(ui_font), Color::WHITE, TextAlign::CENTER, trivia_version::DISPLAY_VERSION);
        it.print(233, 250, id(version_font), Color::WHITE, TextAlign::CENTER, trivia_version::BUILD_UTC);
      }
button:
  - platform: template
    name: Show Doorbell
    on_press:
      - lambda: id(camera_page) = true;
      - script.execute: camera_refresh
      - component.update: panel
  - platform: template
    name: Show Checks
    on_press:
      - lambda: id(camera_page) = false;
      - component.update: panel
  - platform: template
    name: Doorbell Ring Test
    on_press:
      - script.execute: doorbell_ring
sensor:
  - platform: template
    name: Snapshot Age
    unit_of_measurement: s
    update_interval: 5s
    lambda: |-
      return trivia_camera::last.received ? float(millis() - trivia_camera::last.received_at) / 1000.0f : NAN;
  - platform: template
    name: Microphone Test Peak
    update_interval: 1s
    lambda: return float(trivia_metrics::microphone_peak.load());
  - platform: template
    name: Touch X
    update_interval: 1s
    lambda: return float(id(touch_x));
  - platform: template
    name: Touch Y
    update_interval: 1s
    lambda: return float(id(touch_y));
  - platform: template
    name: Yellow Press Count
    update_interval: 1s
    lambda: return float(id(yellow_count));
  - platform: template
    name: Blue Press Count
    update_interval: 1s
    lambda: return float(id(blue_count));
  - platform: template
    name: Power Press Count
    update_interval: 1s
    lambda: return float(id(power_count));
text_sensor:
  - platform: template
    name: Test Status
    update_interval: 1s
    lambda: return id(ui_action);
  - platform: template
    name: Screen Page
    update_interval: 1s
    lambda: |-
      return id(camera_page) ? std::string("Doorbell") : std::string("Checks");
interval:
  # Defer refresh until after OnlineImage closes its previous connection.
  # Minimum request period 500ms; failures back off to 2s. Audio gates stay intact.
  - interval: 100ms
    then:
      - lambda: |-
          if (id(camera_fetching) && millis() - id(camera_requested_at) > 5000) {
            id(doorbell_frame).release();
            id(camera_fetching) = false;
            id(camera_error) = true;
            ESP_LOGW("camera_check", "event=download_deadline last_good_retained=%s", trivia_camera::last.received ? "yes" : "no");
          }
      - script.execute: camera_refresh
  - interval: 60s
    then:
      - lambda: |-
          static uint32_t last_ms = 0, last_downloaded = 0, last_presented = 0;
          const uint32_t now = millis();
          ESP_LOGI("camera_check", "event=rate_sample interval_ms=%u downloaded_delta=%u presented_delta=%u total_downloaded=%u total_presented=%u", unsigned(now - last_ms), unsigned(trivia_camera::last.received - last_downloaded), unsigned(trivia_camera::last.presented - last_presented), unsigned(trivia_camera::last.received), unsigned(trivia_camera::last.presented));
          last_ms = now; last_downloaded = trivia_camera::last.received; last_presented = trivia_camera::last.presented;

text:
  - platform: template
    id: camera_snapshot_url
    name: Camera Snapshot URL
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ""
    max_length: 255
    mode: text
    on_value:
      then:
        - lambda: |-
            id(doorbell_frame).release();
            id(camera_fetching) = false;
            id(camera_error) = false;
            trivia_camera::last.clear();
            id(doorbell_frame).set_url(x.empty() ? "http://example.invalid/snapshot.jpg" : x);
        - component.update: panel
